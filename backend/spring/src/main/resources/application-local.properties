app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/starlight_news?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ssafy}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.with-credentials=true

spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=always

logging.level.com.starlightnews.backend=DEBUG
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
