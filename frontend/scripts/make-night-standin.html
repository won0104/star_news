<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>밤 스탠드인 뽑기</title>
    <style>
      body { font: 14px/1.6 system-ui, sans-serif; margin: 32px; max-width: 900px; }
      h1 { font-size: 18px; }
      textarea { width: 100%; height: 7em; font: 11px/1.4 monospace; margin-bottom: 4px; }
      figure { display: inline-block; margin: 0 16px 16px 0; }
      img { width: 180px; image-rendering: auto; border: 1px solid #ccc; }
      code { background: #f3f3f3; padding: 1px 4px; }
    </style>
  </head>
  <body>
    <h1>밤 스탠드인 뽑기</h1>
    <p>
      <code>src/data/trend.js</code> 의 <code>nightfall.standIns</code> 에 넣을 data URI 를 만든다.
      개발 서버를 띄운 채 이 파일을 그 서버 주소로 연다 —
      <code>http://localhost:5174/../scripts/make-night-standin.html</code> 이 아니라, 아래 경로가
      같은 출처에서 읽히기만 하면 된다. 캔버스가 원본을 읽어야 하므로 file:// 로 열면 안 된다.
    </p>
    <p><code>nightfall.backdrops</code> 의 사진을 바꾸면 여기서 두 줄을 다시 뽑아 붙여넣는다.</p>
    <div id="out">만드는 중…</div>
    <script type="module">
      /* 긴 변 56px, webp 0.72 — 1KB 남짓이면서 산 능선과 호수 불빛이 남는 지점. */
      const LONG_EDGE = 56
      const QUALITY = 0.72
      const SOURCES = {
        landscape: '/assets/trend/trend-window-backdrop-landscape-v2.webp',
        portrait: '/assets/trend/trend-window-backdrop-portrait-v2.webp',
      }

      const shrink = async (url) => {
        const image = new Image()
        image.src = url
        await image.decode()
        const scale = LONG_EDGE / Math.max(image.naturalWidth, image.naturalHeight)
        const canvas = document.createElement('canvas')
        canvas.width = Math.round(image.naturalWidth * scale)
        canvas.height = Math.round(image.naturalHeight * scale)
        const context = canvas.getContext('2d')
        context.imageSmoothingQuality = 'high'
        context.drawImage(image, 0, 0, canvas.width, canvas.height)
        return { uri: canvas.toDataURL('image/webp', QUALITY), w: canvas.width, h: canvas.height }
      }

      const out = document.getElementById('out')
      out.textContent = ''
      for (const [name, url] of Object.entries(SOURCES)) {
        const { uri, w, h } = await shrink(url)
        const block = document.createElement('section')
        block.innerHTML =
          `<h2>${name} — ${w}×${h}, ${(uri.length / 1024).toFixed(2)} KB</h2>` +
          `<figure><img alt=""></figure>` +
          `<textarea readonly></textarea>`
        block.querySelector('img').src = uri
        block.querySelector('textarea').value = uri
        out.append(block)
      }
    </script>
  </body>
</html>
