app.cors.allowed-origins=http://localhost:3000

# 기본(로컬): Testcontainers MySQL (jdbc:tc → Docker 필요)
# CI: ci.sh 가 DB_URL / DB_DRIVER 로 compose MySQL 을 주입 (Testcontainers 미사용)
spring.datasource.url=${DB_URL:jdbc:tc:mysql:8.4:///mysqldb}
spring.datasource.driver-class-name=${DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
spring.datasource.username=${DB_USERNAME:test}
spring.datasource.password=${DB_PASSWORD:test}

# 스키마는 Flyway, 엔티티는 validate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.enabled=${FLYWAY_ENABLED:true}

spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4j-local-only-override-me}

app.auth.store=${APP_AUTH_STORE:memory}
app.cache.store=${APP_CACHE_STORE:none}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
