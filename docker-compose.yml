name: s15p21e206

services:
  # Frontend 컨테이너 설정

  frontend:
    build:
      context: ./frontend
    image: frontend:dev
    container_name: frontend
    ports:
      - "127.0.0.1:3000:80"


  # MySQL 컨테이너 설정

  mysql:
    image: mysql:8.4
    container_name: mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-spring:
    build:
      context: ./backend/spring
    image: backend-spring:dev
    container_name: backend-spring
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      APP_AUTH_STORE: redis
      # 개인 그래프 참여도 집계 캐시: none(기본) | redis
      # 사용자별 노드가 많아져 /users/me/graph 가 느려질 때 .env 에 APP_CACHE_STORE=redis 만 넣으면 켜진다.
      APP_CACHE_STORE: ${APP_CACHE_STORE:-none}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      GNEWS_MAX: ${GNEWS_MAX:-12}
      GNEWS_COLLECT_CRON: "${GNEWS_COLLECT_CRON:-0 10 * * * *}"
      GNEWS_RETRY_DELAY: ${GNEWS_RETRY_DELAY:-1s}
      # 지난 구간 기사 백필. 일회성이라 켜고 재시작했다가 끝나면 다시 끈다.
      # 구간은 오프셋까지 적는다(예: 2026-09-26T00:00:00Z).
      GNEWS_BACKFILL_ENABLED: ${GNEWS_BACKFILL_ENABLED:-false}
      GNEWS_BACKFILL_FROM: ${GNEWS_BACKFILL_FROM:-}
      GNEWS_BACKFILL_TO: ${GNEWS_BACKFILL_TO:-}
      GNEWS_BACKFILL_SLICE: ${GNEWS_BACKFILL_SLICE:-6h}
      GNEWS_BACKFILL_MAX_PAGES: ${GNEWS_BACKFILL_MAX_PAGES:-3}
      # 배치 주기와 한도. 기본값은 application.properties 와 같다.
      # 서버에서 잠깐 당겨 돌려 보거나 처리량을 조절할 때 .env 로 덮어쓴다(재배포 없이 재시작만 하면 된다).
      ARTICLE_ANALYSIS_CRON: "${ARTICLE_ANALYSIS_CRON:-0 20 * * * *}"
      ARTICLE_ANALYSIS_TIME_BUDGET: ${ARTICLE_ANALYSIS_TIME_BUDGET:-45m}
      TREND_AGGREGATE_CRON: "${TREND_AGGREGATE_CRON:-0 0 5,17 * * *}"
      USER_GRAPH_SYNC_CRON: "${USER_GRAPH_SYNC_CRON:-0 0 1-23/2 * * *}"
      RECOMMENDATION_GENERATE_CRON: "${RECOMMENDATION_GENERATE_CRON:-0 30 5,17 * * *}"
      RECOMMENDATION_RETUNE_CRON: "${RECOMMENDATION_RETUNE_CRON:-0 0 3 * * SUN}"
      # GMS(SSAFY OpenAI 중계). 기사/이벤트 요약에 사용. 키는 루트 .env 로 주입한다.
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      GMS_MODEL: ${GMS_MODEL:-gpt-5.4-nano}
      GMS_TIMEOUT: ${GMS_TIMEOUT:-60s}
      # FastAPI 내부 호출. 키는 backend-fastapi 와 같은 값이어야 하고,
      # 주소는 compose 네트워크의 서비스명으로 접근한다(컨테이너 안에서 localhost 는 자기 자신이다).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      FASTAPI_BASE_URL: ${FASTAPI_BASE_URL:-http://backend-fastapi:8000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy


  # FastAPI 컨테이너 설정

  backend-fastapi:
    build:
      context: ./backend/fastapi
    image: backend-fastapi:dev
    container_name: backend-fastapi
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # FastAPI는 모델을 직접 적재하지 않고 같은 네트워크의 상주 AI 워커를 호출한다.
      AI_BASE_URL: http://ai-worker:8100
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-3}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-150}
    depends_on:
      neo4j:
        condition: service_healthy
      ai-worker:
        condition: service_healthy


  # AI 모델은 일반 앱 CD와 분리해 장시간 상주한다.
  # 갱신이 필요할 때만 infra/scripts/deploy-ai.sh를 명시적으로 실행한다.
  ai-worker:
    build:
      context: ./ai
    image: ai-cpu:dev
    container_name: ai-worker
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      STARLIGHT_AI_DEVICE: cpu
      KG_MODEL_DIR: /models/artifacts/kg-extractor-v3
      ARTICLELOCAL_HF_CACHE: /models/cache/hub
      HF_HUB_CACHE: /models/cache/hub
    volumes:
      # 가중치는 이미지가 아닌 기존 외부 volume에 보존하고 읽기 전용으로 사용한다.
      - ai-cpu-models:/models:ro
    expose:
      - "8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # 현재 CPU 서버의 전체 모델 초기화 시간을 고려해 실패 판정을 늦춘다.
      start_period: 180s


  # Neo4j 컨테이너 설정

  neo4j:
    image: neo4j:5.26
    container_name: neo4j
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - ./backend/fastapi/migrations/neo4j:/migrations:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Redis 컨테이너 설정
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}"
      ]

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  neo4j_data:
  redis_data:
  # 일반 compose 삭제가 모델 가중치 volume의 수명 주기에 영향을 주지 않게 한다.
  ai-cpu-models:
    external: true
    name: ai-cpu-models
