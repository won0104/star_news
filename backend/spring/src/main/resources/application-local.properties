app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# 로컬 개발 전용 JWT 서명 키. 저장소에 공개된 값이므로 운영(prod)에서는 쓰이지 않는다.
app.jwt.secret=${JWT_SECRET:local-dev-only-secret-please-override-in-prod-0123456789}

# 로컬에서는 시연 API 를 켜 둔다(운영 기본값은 false, application.properties 참고).
app.demo.enabled=${DEMO_ENABLED:true}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/starlight_news?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:ssafy}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.with-credentials=true

spring.jpa.properties.hibernate.format_sql=true

management.endpoint.health.show-details=always

logging.level.com.starlightnews.backend=DEBUG
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
