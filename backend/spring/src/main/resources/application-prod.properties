app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Swagger 는 운영에서 기본으로 끈다. 전체 API 목록·요청 형식이 그대로 공개돼 공격 표면을 찾는 데 쓰인다.
# 시연·점검처럼 잠깐 필요할 때만 .env 에 SWAGGER_ENABLED=true 를 넣고 재시작한다.
# (nginx 가 /swagger-ui, /v3/api-docs 를 프록시하므로 켜면 바로 외부에서 열린다)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# 리버스 프록시(nginx) 뒤이므로 X-Forwarded-* 를 반영해 서버 URL(https, 도메인)을 생성한다
server.forward-headers-strategy=framework
# 횟수 제한용 클라이언트 IP. 호스트 nginx 가 X-Real-IP 를 $remote_addr 로 덮어쓰고, Spring 은 127.0.0.1 에만
# 열려 있어 이 헤더는 위조할 수 없다. 위 설정 때문에 remoteAddr 는 X-Forwarded-For 맨 앞(클라이언트가 적은 값)이
# 되므로 그대로 쓰면 안 된다.
app.client-ip.header=${CLIENT_IP_HEADER:X-Real-IP}

# health DOWN 시 어떤 컴포넌트인지 노출 (상태만, 민감정보 없음)
management.endpoint.health.show-components=always

logging.level.com.starlightnews.backend=INFO
