spring.application.name=backend
spring.profiles.default=local
logging.pattern.level=%5p [%X{requestId:--}]

app.jwt.secret=${JWT_SECRET:local-dev-only-secret-please-override-in-prod-0123456789}
app.jwt.access-token-validity=3600000
app.jwt.refresh-token-validity=1209600000

# 공통 JPA / Flyway (프로파일에서 필요 시 재정의)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Neo4j (읽기 전용 그래프 조회). 실제 값은 환경변수/.env 로 주입
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:neo4j-local-only-override-me}

# Redis. 실제 값은 환경변수/.env 로 주입
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# 인증 저장소 구현 선택: memory(기본) | redis
app.auth.store=${APP_AUTH_STORE:memory}

# 개인 그래프 요약(참여도 집계) 캐시 저장소 선택: none(기본) | redis
app.cache.store=${APP_CACHE_STORE:none}

# FastAPI 내부 API. api-key 는 FastAPI 의 INTERNAL_API_KEY 와 같은 값이어야 한다 (커밋 금지)
# 배포 시에는 compose 네트워크의 서비스명으로 접근한다 (예: http://backend-fastapi:8000)
app.fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
app.fastapi.api-key=${INTERNAL_API_KEY:}
app.fastapi.timeout=30s

# GNews 기사 수집. API 키는 환경변수/.env 로 주입한다 (커밋 금지)
# category 는 GNews 원본 분류를 그대로 쓰며 TopicCode 변환은 FastAPI 분석이 담당한다
app.gnews.base-url=${GNEWS_BASE_URL:https://gnews.io/api/v4}
app.gnews.api-key=${GNEWS_API_KEY:}
app.gnews.lang=ko
app.gnews.country=kr
# 요청당 기사 수. 9개 카테고리 x 12 = 회차당 최대 108건(중복 제거 전).
app.gnews.max=${GNEWS_MAX:12}
app.gnews.timeout=10s
# 429에만 최대 2회 재시도한다. 대기는 이 값의 1배, 2배다.
app.gnews.retry-delay=${GNEWS_RETRY_DELAY:1s}
app.gnews.categories=general,world,nation,business,technology,entertainment,sports,science,health
# 수집 주기. 매시 10분에 돌린다.
# AI 분석은 추후 연결한다. 현재는 수집 후 MySQL 저장까지 수행한다.
# (그 밖에 홀수 시 정각 사용자 그래프 동기화, 06:00·18:00 트렌드 집계가 정각을 쓴다)
app.gnews.collect-cron=${GNEWS_COLLECT_CRON:0 10 * * * *}

# 사용자 그래프 동기화. 홀수 시 정각에 돌려 05:00·17:00 을 포함시킨다.
# 05:30·17:30 추천 계산이 이 결과를 읽으므로 그 직전 실행이 반드시 있어야 한다.
app.user-graph.sync-cron=${USER_GRAPH_SYNC_CRON:0 0 1-23/2 * * *}
# 한 요청에 담을 사용자 수. 사용자 단위로만 나눈다(한 사용자를 쪼개면 앞 요청의 관계가 지워진다).
app.user-graph.chunk-size=${USER_GRAPH_CHUNK_SIZE:100}

# actuator: 헬스체크만 노출 (상세는 프로파일별)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
