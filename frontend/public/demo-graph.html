<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기사 → 지식그래프 (시연 확인용)</title>
<!--
  백엔드 /api/v1/demo/articles 를 눈으로 확인하기 위한 목 화면이다.
  서비스 화면이 아니라 React 앱 밖의 정적 파일로 두고, vite dev 서버가 /api 를 프록시한다.

    cd frontend
    VITE_API_PROXY_TARGET=http://localhost:8080 npm run dev
    → http://localhost:5173/demo-graph.html

  로컬 백엔드 대신 배포 서버를 보려면 VITE_API_PROXY_TARGET 을 빼면 된다(배포 후).
-->
<style>
  :root {
    --bg: #0f1014;
    --panel: #181920;
    --border: #2a2c36;
    --text: #e8e8ea;
    --muted: #8b8d98;
    --accent: #5b8def;
    --article: #5b8def;
    --event: #e0913a;
    --entity: #4fb477;
    --statement: #b06fd4;
    --topic: #d45f7a;
    --time: #6fb7c9;
    --story: #c9b06f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  aside {
    width: 380px; flex: none; padding: 18px; overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--panel);
  }
  h1 { margin: 0 0 4px; font-size: 16px; }
  .sub { margin: 0 0 16px; font-size: 12px; color: var(--muted); line-height: 1.5; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  input[type=text], textarea {
    width: 100%; background: #101119; color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px;
    font-size: 13px; font-family: inherit;
  }
  /* 오른쪽 아래 모서리를 끌어 가로·세로 모두 늘릴 수 있다. */
  textarea { min-height: 220px; resize: both; line-height: 1.5; }
  button.link {
    display: inline; width: auto; margin: 0; padding: 0 2px;
    background: none; border: 0; color: var(--accent);
    font-size: inherit; font-weight: 600; font-family: inherit;
    text-decoration: underline; cursor: pointer;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .row label { margin: 0; color: var(--text); font-size: 13px; }
  button {
    width: 100%; margin-top: 14px; padding: 10px;
    background: var(--accent); color: #fff; border: 0; border-radius: 7px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button:disabled { background: #333644; color: var(--muted); cursor: default; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .status { margin-top: 12px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  .status.err { color: #ff8b8b; }
  .status b { color: var(--text); }
  main { flex: 1; position: relative; min-width: 0; }

  aside.right {
    width: 270px; flex: none; padding: 16px 14px; overflow-y: auto;
    border-right: 0; border-left: 1px solid var(--border); background: var(--panel);
  }
  aside.right h2 {
    margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--muted);
    letter-spacing: .02em;
  }
  aside.right h2:not(:first-child) { margin-top: 18px; }
  .filter { display: flex; flex-direction: column; gap: 5px; }
  .filter label {
    display: flex; align-items: center; gap: 7px; margin: 0;
    font-size: 12.5px; color: var(--text); cursor: pointer;
  }
  .filter i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .filter .count { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .events { display: flex; flex-direction: column; gap: 6px; }
  .events button {
    width: 100%; margin: 0; padding: 8px 10px; text-align: left;
    background: var(--box-bg, #101119); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px;
    font-size: 12.5px; font-weight: 400; line-height: 1.45; cursor: pointer;
  }
  .events button.primary { border-color: var(--event); }
  .events button .tag { display: block; font-size: 10.5px; color: var(--event); margin-bottom: 2px; }
  .events .none { font-size: 12.5px; color: var(--muted); }
  .events .group {
    font-size: 11px; color: var(--muted); margin: 8px 0 1px; letter-spacing: .02em;
  }
  .events .group:first-child { margin-top: 0; }
  aside.right .toggle {
    display: flex; align-items: center; gap: 7px; margin: 0;
    font-size: 12.5px; color: var(--text); cursor: pointer;
  }
  aside.right button.wide {
    width: auto; flex: 1; margin: 0; padding: 6px 8px; font-size: 12px;
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px;
  }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .legend {
    position: absolute; left: 14px; bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 10px;
    font-size: 11.5px; color: var(--muted);
    background: rgba(15,16,20,.85); padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--border);
  }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .counts {
    position: absolute; right: 14px; top: 14px;
    font-size: 12px; color: var(--muted);
    background: rgba(15,16,20,.85); padding: 8px 11px; border-radius: 8px;
    border: 1px solid var(--border);
  }
  .hint { position: absolute; left: 14px; top: 14px; font-size: 11.5px; color: var(--muted); }
  .zoom {
    position: absolute; right: 14px; bottom: 14px;
    display: flex; gap: 6px; align-items: center;
    background: rgba(15,16,20,.85); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px;
  }
  .zoom button {
    width: 28px; height: 28px; margin: 0; padding: 0;
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; font-size: 15px; line-height: 1;
  }
  .zoom button.wide { width: auto; padding: 0 9px; font-size: 12px; }
  .zoom span { font-size: 12px; color: var(--muted); min-width: 38px; text-align: center; }
  .relLabel { font-size: 9px; fill: var(--muted); }
  .detail {
    position: absolute; left: 0; top: 0; width: 300px; max-width: calc(100% - 28px);
    background: rgba(15,16,20,.95); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 13px; line-height: 1.6;
  }
  .detail[hidden] { display: none; }
  .detail .kind { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
  .detail .full { word-break: break-word; }
  .detail .rels { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--border);
                  font-size: 12px; color: var(--muted); }
  .detail .rels div { margin: 2px 0; }
  .detail .close { position: absolute; right: 10px; top: 8px; width: auto; margin: 0;
                   padding: 0 4px; background: none; color: var(--muted); font-size: 15px; }
  .busy {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(15,16,20,.72);
  }
  .busy[hidden] { display: none; }
  .spinner {
    width: 38px; height: 38px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy .what { font-size: 13.5px; color: var(--text); }
  .busy .what b { font-variant-numeric: tabular-nums; }
  .busy .bar {
    width: 260px; max-width: 60%; height: 4px; border-radius: 2px;
    background: var(--border); overflow: hidden;
  }
  .busy .bar i {
    display: block; height: 100%; width: 0; border-radius: 2px;
    background: var(--accent); transition: width .4s linear;
  }
  /* 얼마나 걸릴지 모를 때는 채우는 대신 좌우로 흐르게 둔다. */
  .busy .bar.unknown i { width: 40%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide {
    0% { margin-left: -40%; } 100% { margin-left: 100%; }
  }
  .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; line-height: 2;
  }
  /* 클래스 선택자가 기본 [hidden] 규칙보다 우선하므로 여기서 다시 숨긴다. */
  .empty[hidden], .counts[hidden] { display: none; }

  @media (max-width: 1100px) {
    body { flex-direction: column; height: auto; }
    aside, aside.right {
      width: 100%; border-right: 0; border-left: 0;
      border-bottom: 1px solid var(--border);
    }
    main { height: 70vh; }
  }
  text { user-select: none; }
  /* 이름을 눌러도 노드를 잡을 수 있게 한다. 관계 이름은 방해만 되므로 통과시킨다. */
  #nodes text { cursor: pointer; }
  .relLabel { pointer-events: none; }
</style>
</head>
<body>

<aside>
  <h1>기사 → 지식그래프</h1>

  <label for="title">제목</label>
  <input id="title" type="text" placeholder="부산 북항 친수공원에 이틀째 상어 출몰">

  <label for="source">언론사 (선택)</label>
  <input id="source" type="text" placeholder="연합뉴스">

  <label for="content">본문 (100자 이상)</label>
  <textarea id="content" placeholder="기사 본문을 붙여넣으세요."></textarea>

  <div class="row">
    <input id="primaryOnly" type="checkbox" checked>
    <label for="primaryOnly">대표 사건만 보기 (즉시 전환)</label>
  </div>
  <div class="row">
    <input id="showRelations" type="checkbox" checked>
    <label for="showRelations">간선에 관계 이름 표시</label>
  </div>

  <button id="submit">기사 넣고 분석</button>

  <label for="articleId">이미 분석된 기사 다시 보기</label>
  <div class="row">
    <input id="articleId" type="text" placeholder="기사 ID">
    <button id="load" class="ghost" style="width:auto; margin:0; padding:8px 14px;">조회</button>
  </div>

  <div id="status" class="status">기사를 넣어 보세요.</div>
</aside>

<main>
  <svg id="canvas"></svg>
  <div class="hint">노드를 끌어 옮기기 · 빈 곳을 끌어 화면 이동 · 노드를 누르면 전체 이름</div>
  <div class="zoom">
    <button id="zoomOut" title="축소">−</button>
    <span id="zoomLevel">100%</span>
    <button id="zoomIn" title="확대">+</button>
    <button id="zoomFit" class="wide" title="전체 보기">맞춤</button>
  </div>
  <div id="detail" class="detail" hidden>
    <button id="detailClose" class="close">×</button>
    <div class="kind"></div>
    <div class="full"></div>
    <div class="rels"></div>
  </div>
  <div id="counts" class="counts" hidden></div>
  <div id="busy" class="busy" hidden>
    <div class="spinner"></div>
    <div class="what"></div>
    <div class="bar"><i></i></div>
  </div>
  <div id="empty" class="empty">
    <div>
      아직 그래프가 없습니다.<br>
      <button id="sample" class="link">기사 12205 불러오기</button>
    </div>
  </div>
</main>

<aside class="right">
  <h2>보기</h2>
  <label class="toggle">
    <input id="primaryOnlyRight" type="checkbox" checked>
    대표 사건만 보기
  </label>

  <h2>종류별 표시</h2>
  <div class="row" style="margin:0 0 8px">
    <button id="selectAll" class="wide">모두 선택</button>
    <button id="clearAll" class="wide">모두 해제</button>
  </div>
  <div id="filter" class="filter"></div>

  <h2>노드 목록</h2>
  <div id="events" class="events"><div class="none">아직 없습니다.</div></div>
</aside>

<script>
const COLORS = {
  ARTICLE: '#5b8def', EVENT: '#e0913a', ENTITY: '#4fb477',
  STATEMENT: '#b06fd4', TOPIC: '#d45f7a', TIME: '#6fb7c9', STORY: '#c9b06f',
};
const RADIUS = { ARTICLE: 13, EVENT: 9, STORY: 8 };

const $ = (id) => document.getElementById(id);
const svg = $('canvas');
const statusBox = $('status');

let simulation = null;

/**
 * 마지막으로 받아 온 응답 전체.
 *
 * 서버에는 항상 전부(primaryOnly=false) 달라고 한다. 대표 사건만 보기는 그 응답의 부분집합이라
 * 화면에서 걸러내면 되고, 그래야 체크박스를 누를 때마다 30~60초를 다시 기다리지 않는다.
 */
let received = null;

function setStatus(html, isError) {
  statusBox.className = isError ? 'status err' : 'status';
  statusBox.innerHTML = html;
}

/* ---------- 보기 전환 ---------- */

const TYPE_NAMES = {
  ARTICLE: '기사', EVENT: '사건', ENTITY: '개체', STATEMENT: '발언',
  TOPIC: '분류', TIME: '시점', STORY: '스토리',
};

/** 체크를 끈 노드 종류. 그 종류의 노드와 거기 걸린 간선을 화면에서 뺀다. */
const hiddenTypes = new Set();

/** 종류별 표시 목록을 지금 보고 있는 그래프 기준으로 다시 만든다. */
function rebuildFilter(view) {
  const counts = new Map();
  for (const node of view.nodes) {
    counts.set(node.nodeType, (counts.get(node.nodeType) ?? 0) + 1);
  }

  $('filter').innerHTML = Object.keys(TYPE_NAMES)
    .filter((type) => counts.has(type))
    .map((type) => `
      <label>
        <input type="checkbox" data-type="${type}" ${hiddenTypes.has(type) ? '' : 'checked'}>
        <i style="background:var(--${type.toLowerCase()})"></i>
        ${TYPE_NAMES[type]}
        <span class="count">${counts.get(type)}</span>
      </label>`).join('');

  for (const box of $('filter').querySelectorAll('input')) {
    box.addEventListener('change', () => {
      if (box.checked) hiddenTypes.delete(box.dataset.type);
      else hiddenTypes.add(box.dataset.type);
      applyView();
    });
  }
}

/**
 * 노드 목록. 종류별 표시에서 켜 둔 종류만 보여 주고, 누르면 그 노드를 화면 가운데로 옮긴다.
 */
function rebuildList(view) {
  const primaryKeys = new Set(view.edges
    .filter((edge) => edge.relation === 'COVERS' && edge.primary)
    .map((edge) => edge.to));

  const sections = Object.keys(TYPE_NAMES)
    .filter((type) => !hiddenTypes.has(type))
    .map((type) => {
      const nodes = view.nodes.filter((node) => node.nodeType === type);
      if (nodes.length === 0) {
        return '';
      }
      const items = nodes.map((node) => `
        <button data-key="${node.nodeKey}" class="${primaryKeys.has(node.nodeKey) ? 'primary' : ''}">
          ${primaryKeys.has(node.nodeKey) ? '<span class="tag">대표 사건</span>' : ''}
          ${escapeHtml(node.label ?? '(이름 없음)')}
        </button>`).join('');
      return `<div class="group">${TYPE_NAMES[type]} ${nodes.length}</div>${items}`;
    })
    .join('');

  $('events').innerHTML = sections || '<div class="none">표시할 노드가 없습니다.</div>';
  for (const button of $('events').querySelectorAll('button')) {
    button.addEventListener('click', () => focusNode(button.dataset.key));
  }
}

/** 종류별 표시를 한 번에 켜거나 끈다. */
function setAllTypes(enabled) {
  hiddenTypes.clear();
  if (!enabled) {
    for (const type of Object.keys(TYPE_NAMES)) hiddenTypes.add(type);
  }
  applyView();
}

/** 노드 하나를 화면 가운데로 옮기고 상세를 연다. */
function focusNode(nodeKey) {
  const index = current.nodes.findIndex((node) => node.nodeKey === nodeKey);
  if (index < 0) return;
  const node = current.nodes[index];
  viewport.x = svg.clientWidth / 2 - node.x * viewport.scale;
  viewport.y = svg.clientHeight / 2 - node.y * viewport.scale;
  applyViewport();
  showDetail(index);
}

/** 체크를 끈 종류의 노드와 그 노드에 걸린 간선을 뺀다. */
function applyTypeFilter(view) {
  if (hiddenTypes.size === 0) return view;
  const nodes = view.nodes.filter((node) => !hiddenTypes.has(node.nodeType));
  const kept = new Set(nodes.map((node) => node.nodeKey));
  return { ...view, nodes, edges: view.edges.filter((edge) => kept.has(edge.from) && kept.has(edge.to)) };
}

/** 기사가 대표로 다루는 사건만 남긴다. 서버 쪽 primaryOnly 와 같은 규칙이다. */
function keepPrimaryOnly(data) {
  const article = data.articleNodeId;
  const primaryEvents = new Set(data.edges
    .filter((edge) => edge.relation === 'COVERS' && edge.primary)
    .map((edge) => edge.to));

  const edges = data.edges.filter((edge) => {
    if (edge.from === article) {
      // 스치듯 언급된 개체와 본문 발언은 뺀다. 이 둘이 화면을 채운다.
      if (edge.relation === 'MENTIONS' || edge.relation === 'CONTAINS_STATEMENT') return false;
      return edge.relation !== 'COVERS' || edge.primary;
    }
    return primaryEvents.has(edge.from);
  });

  const kept = new Set([article]);
  for (const edge of edges) { kept.add(edge.from); kept.add(edge.to); }
  return { ...data, nodes: data.nodes.filter((node) => kept.has(node.nodeKey)), edges };
}

/** 받아 둔 응답을 지금 선택한 보기로 그린다. 네트워크를 타지 않는다. */
function applyView() {
  if (!received) return;
  // 같은 설정을 양쪽 패널에 두었으므로 어느 쪽을 눌러도 둘 다 맞춘다.
  $('primaryOnlyRight').checked = $('primaryOnly').checked;
  const view = $('primaryOnly').checked ? keepPrimaryOnly(received) : received;
  // 목록과 개수는 종류 필터를 걸기 전 기준이다. 체크를 꺼도 목록에서 사라지지 않게.
  rebuildFilter(view);
  rebuildList(view);
  draw(applyTypeFilter(view));
}

/* ---------- 진행 표시 ---------- */

/** 분석이 대개 이 정도 걸린다. 막대를 이 값에 맞춰 채운다. */
const EXPECTED_ANALYSIS_SECONDS = 60;

/**
 * 기다리는 동안 회전판과 막대를 띄운다.
 *
 * @param startedAt 분석처럼 오래 걸리는 일은 시작 시각을 넘겨 막대를 채우게 한다.
 *                  넘기지 않으면 얼마나 걸릴지 모르는 일로 보고 막대가 흐르기만 한다.
 */
function showBusy(what, startedAt) {
  const busy = $('busy');
  busy.querySelector('.what').textContent = what;
  busy.querySelector('.bar').classList.toggle('unknown', !startedAt);
  busy.querySelector('.bar i').style.width = startedAt ? '0%' : '';
  busy.hidden = false;
  if (startedAt) updateBusy(startedAt);
}

function updateBusy(startedAt) {
  const seconds = (Date.now() - startedAt) / 1000;
  // 예상보다 오래 걸려도 다 찬 것처럼 보이지 않게 95% 에서 멈춘다.
  const ratio = Math.min(0.95, seconds / EXPECTED_ANALYSIS_SECONDS);
  $('busy').querySelector('.bar i').style.width = `${ratio * 100}%`;
  $('busy').querySelector('.what').innerHTML = `분석 중 <b>${Math.round(seconds)}초</b>`;
}

function hideBusy() {
  $('busy').hidden = true;
}

/* ---------- API ---------- */

async function call(path, options) {
  const response = await fetch(path, options);
  const payload = await response.json().catch(() => null);
  if (!response.ok) {
    const code = payload?.code ? ` (${payload.code})` : '';
    throw new Error((payload?.message ?? `요청 실패 ${response.status}`) + code);
  }
  return payload?.data ?? null;
}

async function submitArticle() {
  const title = $('title').value.trim();
  const content = $('content').value.trim();
  const sourceName = $('source').value.trim();
  if (!title || content.length < 100) {
    setStatus('제목과 본문(100자 이상)이 필요합니다.', true);
    return;
  }

  const started = Date.now();
  showBusy('분석 중', started);
  const timer = setInterval(() => {
    const seconds = Math.round((Date.now() - started) / 1000);
    setStatus(`분석 중… <b>${seconds}초</b> 경과 (최대 150초)`);
    updateBusy(started);
  }, 250);
  $('submit').disabled = true;

  try {
    // 항상 전부 받아 둔다. 대표 사건만 보기는 받은 것에서 걸러 쓴다.
    const data = await call('/api/v1/demo/articles?primaryOnly=false', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content, sourceName: sourceName || undefined }),
    });
    clearInterval(timer);
    $('articleId').value = data.articleId;
    received = data;
    const seconds = Math.round((Date.now() - started) / 1000);
    setStatus(`완료 · <b>${seconds}초</b> 걸림<br>기사 ID <b>${data.articleId}</b>`
      + ` · 분류 <b>${data.topicCode ?? '-'}</b>`
      + `${data.subtopicCode ? ' / ' + data.subtopicCode : ''}`);
    applyView();
  } catch (failure) {
    clearInterval(timer);
    setStatus(failure.message, true);
  } finally {
    hideBusy();
    $('submit').disabled = false;
  }
}

async function loadArticle() {
  const articleId = $('articleId').value.trim();
  if (!articleId) return;
  setStatus('불러오는 중…');
  showBusy('불러오는 중');
  try {
    const data = await call(`/api/v1/demo/articles/${articleId}/graph?primaryOnly=false`);
    received = data;
    setStatus(`기사 ID <b>${data.articleId}</b> · 분류 <b>${data.topicCode ?? '-'}</b>`
      + `${data.subtopicCode ? ' / ' + data.subtopicCode : ''}`);
    applyView();
  } catch (failure) {
    setStatus(failure.message, true);
  } finally {
    hideBusy();
  }
}

/* ---------- 그리기 ----------
   라이브러리 없이 쓰는 최소 force 레이아웃. 노드끼리 밀어내고, 간선이 당기고,
   가운데로 약하게 모은다. 확인용이라 정교할 필요는 없다.                      */

/** 노드를 누르면 여는 상세. 이름이 길어 줄임표로 잘린 것을 여기서 전부 보여 준다. */
let current = { nodes: [], links: [] };

/** 상세를 열어 둔 노드. 화면을 옮기거나 확대할 때 카드도 같이 따라가야 한다. */
let detailIndex = null;

/** 상세 카드를 그 노드 바로 아래에 둔다. 화면 밖으로 나가지 않게 가장자리에서 멈춘다. */
function positionDetail() {
  const detail = $('detail');
  if (detailIndex === null || detail.hidden) return;
  const node = current.nodes[detailIndex];
  if (!node) return;

  const gap = 16;
  const left = node.x * viewport.scale + viewport.x - detail.offsetWidth / 2;
  const top = node.y * viewport.scale + viewport.y + gap;
  const maxLeft = svg.clientWidth - detail.offsetWidth - 8;
  const maxTop = svg.clientHeight - detail.offsetHeight - 8;

  detail.style.left = `${Math.max(8, Math.min(maxLeft, left))}px`;
  detail.style.top = `${Math.max(8, Math.min(maxTop, top))}px`;
}

function showDetail(nodeIndex) {
  const node = current.nodes[nodeIndex];
  if (!node) return;
  const detail = $('detail');

  const kind = node.nodeType + (node.subType ? ' · ' + node.subType : '');
  detail.querySelector('.kind').textContent = kind;
  detail.querySelector('.full').textContent = node.label ?? '(이름 없음)';

  // 이 노드에 걸린 관계를 종류별로 센다. 무엇과 어떻게 이어졌는지가 이름만큼 궁금하다.
  const counts = new Map();
  for (const link of current.links) {
    const other = link.source === nodeIndex ? link.target
      : link.target === nodeIndex ? link.source : null;
    if (other === null) continue;
    const direction = link.source === nodeIndex ? '→' : '←';
    const key = `${direction} ${link.relation}`;
    counts.set(key, (counts.get(key) ?? 0) + 1);
  }
  detail.querySelector('.rels').innerHTML = counts.size === 0
    ? '연결 없음'
    : [...counts].map(([key, count]) => `<div>${escapeHtml(key)} · ${count}개</div>`).join('');

  detail.hidden = false;
  detailIndex = nodeIndex;
  positionDetail();
}

function hideDetail() {
  $('detail').hidden = true;
  detailIndex = null;
}

function draw(data) {
  const nodes = data.nodes.map((node) => ({ ...node, x: 0, y: 0, vx: 0, vy: 0 }));
  const index = new Map(nodes.map((node, i) => [node.nodeKey, i]));
  const links = data.edges
    .filter((edge) => index.has(edge.from) && index.has(edge.to))
    .map((edge) => ({ ...edge, source: index.get(edge.from), target: index.get(edge.to) }));

  current = { nodes, links };
  hideDetail();
  $('empty').hidden = nodes.length > 0;
  $('counts').hidden = nodes.length === 0;
  $('counts').textContent = `노드 ${nodes.length} · 간선 ${links.length}`;
  if (!nodes.length) {
    svg.innerHTML = '';
    return;
  }

  const width = svg.clientWidth || 900;
  const height = svg.clientHeight || 700;
  nodes.forEach((node, i) => {
    const angle = (i / nodes.length) * Math.PI * 2;
    const spread = node.nodeType === 'ARTICLE' ? 0 : 150 + (i % 7) * 30;
    node.x = width / 2 + Math.cos(angle) * spread;
    node.y = height / 2 + Math.sin(angle) * spread;
  });

  if (simulation) cancelAnimationFrame(simulation);
  render(nodes, links, width, height);
  run(nodes, links, width, height);
}

function run(nodes, links, width, height) {
  let alpha = 1;
  const step = () => {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i]; const b = nodes[j];
        let dx = b.x - a.x; let dy = b.y - a.y;
        let distance = Math.hypot(dx, dy) || 0.1;
        if (distance > 320) continue;
        const push = (2400 / (distance * distance)) * alpha;
        dx /= distance; dy /= distance;
        a.vx -= dx * push; a.vy -= dy * push;
        b.vx += dx * push; b.vy += dy * push;
      }
    }
    for (const link of links) {
      const a = nodes[link.source]; const b = nodes[link.target];
      const dx = b.x - a.x; const dy = b.y - a.y;
      const distance = Math.hypot(dx, dy) || 0.1;
      const pull = ((distance - 90) / distance) * 0.035 * alpha;
      a.vx += dx * pull; a.vy += dy * pull;
      b.vx -= dx * pull; b.vy -= dy * pull;
    }
    for (const node of nodes) {
      // 사람이 끌어다 놓은 노드는 그 자리에 둔다.
      if (node.pinned) { node.vx = 0; node.vy = 0; continue; }
      node.vx += (width / 2 - node.x) * 0.0012 * alpha;
      node.vy += (height / 2 - node.y) * 0.0012 * alpha;
      node.x += node.vx; node.y += node.vy;
      node.vx *= 0.82; node.vy *= 0.82;
    }

    update(nodes, links);
    alpha *= 0.985;
    if (alpha > 0.02) simulation = requestAnimationFrame(step);
  };
  simulation = requestAnimationFrame(step);
}

let viewport = { x: 0, y: 0, scale: 1 };

function render(nodes, links, width, height) {
  viewport = { x: 0, y: 0, scale: 1 };
  svg.innerHTML = `<g id="viewport">
    <g id="links" stroke-linecap="round"></g>
    <g id="relLabels"></g>
    <g id="nodes"></g>
  </g>`;

  const linkLayer = svg.querySelector('#links');
  linkLayer.innerHTML = links.map((link) => `
    <line stroke="${link.primary ? '#7f8aa3' : '#3a3d4a'}"
          stroke-width="${link.primary ? 2 : 1}"></line>`).join('');

  // 관계 이름은 간선 가운데에 둔다. 끄면 아예 만들지 않아 프레임마다 옮길 것도 없다.
  const labelLayer = svg.querySelector('#relLabels');
  labelLayer.innerHTML = $('showRelations').checked
    ? links.map((link) => `<text class="relLabel" text-anchor="middle"
        >${escapeHtml(link.relation)}</text>`).join('')
    : '';

  const nodeLayer = svg.querySelector('#nodes');
  nodeLayer.innerHTML = nodes.map((node, index) => {
    const radius = RADIUS[node.nodeType] ?? 6;
    const color = COLORS[node.nodeType] ?? '#888';
    const label = (node.label ?? '').length > 22
      ? node.label.slice(0, 22) + '…'
      : (node.label ?? '');
    const title = `${node.nodeType}${node.subType ? ' · ' + node.subType : ''}\n${node.label ?? ''}`;
    return `<g data-index="${index}" style="cursor:pointer"><title>${escapeHtml(title)}</title>
      <circle r="${radius}" fill="${color}" stroke="#0f1014" stroke-width="1.5"></circle>
      <text font-size="${node.nodeType === 'ARTICLE' ? 13 : 10.5}" fill="#c9cad2"
            text-anchor="middle" dy="${-radius - 5}">${escapeHtml(label)}</text>
    </g>`;
  }).join('');
}

function update(nodes, links) {
  const lines = svg.querySelectorAll('#links line');
  const labels = svg.querySelectorAll('#relLabels text');
  links.forEach((link, i) => {
    const a = nodes[link.source]; const b = nodes[link.target];
    const line = lines[i];
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    const label = labels[i];
    if (label) {
      label.setAttribute('x', (a.x + b.x) / 2);
      label.setAttribute('y', (a.y + b.y) / 2 - 2);
    }
  });
  const groups = svg.querySelectorAll('#nodes > g');
  nodes.forEach((node, i) => {
    groups[i].setAttribute('transform', `translate(${node.x},${node.y})`);
  });
  positionDetail();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

/* ---------- 이동 · 확대 ---------- */

const MIN_SCALE = 0.2;
const MAX_SCALE = 4;

function applyViewport() {
  const layer = svg.querySelector('#viewport');
  if (layer) {
    layer.setAttribute('transform',
      `translate(${viewport.x},${viewport.y}) scale(${viewport.scale})`);
  }
  $('zoomLevel').textContent = `${Math.round(viewport.scale * 100)}%`;
  positionDetail();
}

/** 화면 가운데를 기준으로 확대·축소한다. 그래야 보고 있던 곳이 밖으로 밀려나지 않는다. */
function zoomBy(factor) {
  const next = Math.min(MAX_SCALE, Math.max(MIN_SCALE, viewport.scale * factor));
  const centerX = svg.clientWidth / 2;
  const centerY = svg.clientHeight / 2;
  const ratio = next / viewport.scale;
  viewport.x = centerX - (centerX - viewport.x) * ratio;
  viewport.y = centerY - (centerY - viewport.y) * ratio;
  viewport.scale = next;
  applyViewport();
}

/** 노드가 전부 보이도록 배율과 위치를 맞춘다. */
function zoomToFit() {
  if (!current.nodes.length) return;
  const xs = current.nodes.map((node) => node.x);
  const ys = current.nodes.map((node) => node.y);
  const margin = 70;
  const width = Math.max(1, Math.max(...xs) - Math.min(...xs)) + margin * 2;
  const height = Math.max(1, Math.max(...ys) - Math.min(...ys)) + margin * 2;

  const scale = Math.min(MAX_SCALE,
    Math.max(MIN_SCALE, Math.min(svg.clientWidth / width, svg.clientHeight / height)));
  viewport.scale = scale;
  viewport.x = svg.clientWidth / 2 - ((Math.min(...xs) + Math.max(...xs)) / 2) * scale;
  viewport.y = svg.clientHeight / 2 - ((Math.min(...ys) + Math.max(...ys)) / 2) * scale;
  applyViewport();
}

let dragging = null;
let draggingNode = null;
let moved = 0;

/** 화면 좌표를 그래프 좌표로 바꾼다. 확대·이동한 만큼 되돌린다. */
function toGraphPoint(event) {
  const box = svg.getBoundingClientRect();
  return {
    x: (event.clientX - box.left - viewport.x) / viewport.scale,
    y: (event.clientY - box.top - viewport.y) / viewport.scale,
  };
}

svg.addEventListener('mousedown', (event) => {
  moved = 0;
  const group = event.target.closest('#nodes > g');
  if (group) {
    // 노드를 잡았으면 화면이 아니라 그 노드를 옮긴다.
    const index = Number(group.dataset.index);
    const point = toGraphPoint(event);
    const node = current.nodes[index];
    draggingNode = { index, dx: node.x - point.x, dy: node.y - point.y };
    return;
  }
  dragging = { x: event.clientX - viewport.x, y: event.clientY - viewport.y };
});

window.addEventListener('mousemove', (event) => {
  if (draggingNode) {
    const point = toGraphPoint(event);
    const node = current.nodes[draggingNode.index];
    moved += Math.abs(node.x - (point.x + draggingNode.dx))
      + Math.abs(node.y - (point.y + draggingNode.dy));
    node.x = point.x + draggingNode.dx;
    node.y = point.y + draggingNode.dy;
    node.vx = 0; node.vy = 0;
    node.pinned = true;
    // 배치 계산이 이미 멈췄을 수 있으므로 여기서 직접 다시 그린다.
    update(current.nodes, current.links);
    return;
  }
  if (!dragging) return;
  const nextX = event.clientX - dragging.x;
  const nextY = event.clientY - dragging.y;
  moved += Math.abs(nextX - viewport.x) + Math.abs(nextY - viewport.y);
  viewport.x = nextX;
  viewport.y = nextY;
  applyViewport();
});

window.addEventListener('mouseup', () => { dragging = null; draggingNode = null; });

// 화면을 끌고 난 뒤의 mouseup 도 click 으로 오므로, 거의 움직이지 않았을 때만 누른 것으로 본다.
svg.addEventListener('click', (event) => {
  if (moved > 5) return;
  const group = event.target.closest('#nodes > g');
  if (group) {
    showDetail(Number(group.dataset.index));
  } else {
    hideDetail();
  }
});
$('detailClose').addEventListener('click', hideDetail);
// 휠 한 칸에 5%만 움직인다. 이전 12% 는 두세 칸만 굴려도 화면이 확 튀었다.
// 트랙패드는 deltaY 가 잘게 여러 번 오므로 그 크기에 비례해 부드럽게 따라가도록 한다.
svg.addEventListener('wheel', (event) => {
  event.preventDefault();
  const steps = Math.max(-3, Math.min(3, -event.deltaY / 100));
  zoomBy(Math.pow(1.05, steps));
}, { passive: false });

$('submit').addEventListener('click', submitArticle);
$('load').addEventListener('click', loadArticle);
$('primaryOnly').addEventListener('change', applyView);
$('primaryOnlyRight').addEventListener('change', () => {
  $('primaryOnly').checked = $('primaryOnlyRight').checked;
  applyView();
});
$('showRelations').addEventListener('change', applyView);
$('zoomIn').addEventListener('click', () => zoomBy(1.25));
$('zoomOut').addEventListener('click', () => zoomBy(1 / 1.25));
$('zoomFit').addEventListener('click', zoomToFit);
$('selectAll').addEventListener('click', () => setAllTypes(true));
$('clearAll').addEventListener('click', () => setAllTypes(false));
$('sample').addEventListener('click', () => {
  $('articleId').value = '12205';
  loadArticle();
});
</script>
</body>
